---
ansible_user: ubuntu

# Куда vmagent на GPU-серверах отправляет метрики (VictoriaMetrics из monitoring_stack).
# Лучше IP приватной сети (VPC), см. monitoring_stack_victoriametrics_listen
monitoring_remote_write_url: "http://{{ hostvars[groups['monitoring'][0]]['ansible_host'] }}:8428/api/v1/write"
# Basic auth VictoriaMetrics: общий для vmagent (запись) и monitoring_stack
monitoring_write_username: vmwriter
monitoring_write_password: "{{ vault_monitoring_write_password }}"

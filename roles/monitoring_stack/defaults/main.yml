---
monitoring_stack_dir: /opt/monitoring

monitoring_stack_victoriametrics_image: victoriametrics/victoria-metrics:v1.155.0
monitoring_stack_vmalert_image: victoriametrics/vmalert:v1.155.0
monitoring_stack_alertmanager_image: prom/alertmanager:v0.34.1
monitoring_stack_grafana_image: grafana/grafana:13.2.5

monitoring_stack_retention: 90d

# Docker publishes ports bypassing UFW, so access is limited by listen address and auth.
# VictoriaMetrics receives remote write from GPU servers: prefer listening on a private network (VPC) IP.
monitoring_stack_victoriametrics_listen: "0.0.0.0:8428"
# Grafana on localhost only: access via `ssh -L 3000:127.0.0.1:3000 <host>`
monitoring_stack_grafana_listen: "127.0.0.1:3000"

# Basic auth on all VictoriaMetrics endpoints (vmagent writes, Grafana/vmalert reads)
monitoring_stack_vm_username: "{{ monitoring_write_username | default('vmwriter') }}"
monitoring_stack_vm_password: "{{ monitoring_write_password | default('') }}"

monitoring_stack_grafana_admin_password: ""

# Dashboards: ${DS_*} placeholders are replaced with the VictoriaMetrics datasource uid
monitoring_stack_grafana_dashboards:
  - name: nvidia-dcgm
    url: https://grafana.com/api/dashboards/12239/revisions/2/download
  - name: node-exporter-full
    url: https://grafana.com/api/dashboards/1860/revisions/45/download
  - name: vllm
    url: https://raw.githubusercontent.com/vllm-project/vllm/v0.32.0/examples/observability/prometheus_grafana/grafana.json

# Alertmanager is disabled until receivers are configured.
# monitoring_stack_alertmanager_config: contents of alertmanager.yml (route, receivers)
monitoring_stack_alertmanager_enabled: false
monitoring_stack_alertmanager_config:
  route:
    receiver: default
    group_by: [alertname, host]
  receivers:
    - name: default

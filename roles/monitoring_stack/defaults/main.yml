---
monitoring_stack_dir: /opt/monitoring

monitoring_stack_victoriametrics_image: victoriametrics/victoria-metrics:v1.155.0
monitoring_stack_vmalert_image: victoriametrics/vmalert:v1.155.0
monitoring_stack_alertmanager_image: prom/alertmanager:v0.34.1
monitoring_stack_grafana_image: grafana/grafana:13.2.5

monitoring_stack_retention: 90d

# All containers use host networking: no Docker-published ports, so UFW applies.
# VictoriaMetrics serves HTTPS with basic auth; UFW opens its port only to
# monitoring_stack_remote_write_sources. Prefer a private network (VPC) IP here.
monitoring_stack_victoriametrics_listen: "0.0.0.0:8428"
# Grafana on localhost only: access via `ssh -L 3000:127.0.0.1:3000 <host>`
monitoring_stack_grafana_listen: "127.0.0.1:3000"
monitoring_stack_vmalert_listen: "127.0.0.1:8880"
monitoring_stack_alertmanager_listen: "127.0.0.1:9093"

# Hosts allowed to reach VictoriaMetrics (vmagent remote write); default: all gpu_servers
monitoring_stack_remote_write_sources: >-
  {{ groups['gpu_servers'] | default([])
     | map('extract', hostvars) | map(attribute='ansible_host', default='') | select | list }}

# Self-signed certificate for VictoriaMetrics. SANs: IPv4 addresses of the host's own interfaces,
# ansible_host, localhost and these extra names/IPs (e.g. a DNS name used in the URL)
monitoring_stack_tls_extra_names: []
monitoring_stack_tls_days: 825

# Basic auth on all VictoriaMetrics endpoints (vmagent writes, Grafana/vmalert reads)
monitoring_stack_vm_username: "{{ monitoring_write_username | default('vmwriter') }}"
monitoring_stack_vm_password: "{{ monitoring_write_password | default('') }}"

monitoring_stack_grafana_admin_password: ""

# Dashboards: ${DS_*} placeholders are replaced with the VictoriaMetrics datasource uid
monitoring_stack_grafana_dashboards:
  - name: nvidia-dcgm
    url: https://grafana.com/api/dashboards/12239/revisions/2/download
  - name: node-exporter-full
    url: https://grafana.com/api/dashboards/1860/revisions/45/download
  - name: vllm
    url: https://raw.githubusercontent.com/vllm-project/vllm/v0.32.0/examples/observability/prometheus_grafana/grafana.json

# Alert notifications. Setting the Telegram bot token and chat id enables Alertmanager.
# monitoring_stack_alertmanager_config: full alertmanager.yml (dict) to use instead of the Telegram one
monitoring_stack_telegram_bot_token: ""
monitoring_stack_telegram_chat_id: ""
monitoring_stack_alertmanager_config: {}
monitoring_stack_alertmanager_enabled: >-
  {{ monitoring_stack_telegram_bot_token | length > 0 or monitoring_stack_alertmanager_config | length > 0 }}

# How vmalert and Grafana reach VictoriaMetrics on the same host
monitoring_stack_vm_local_url: "https://127.0.0.1:{{ monitoring_stack_victoriametrics_listen | split(':') | last }}"

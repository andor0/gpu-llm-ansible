---
- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_stack_dir }}"
    services: [grafana]
    state: restarted

- name: Reload vmalert
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_stack_dir }}"
    services: [vmalert]
    state: restarted

- name: Restart alertmanager
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_stack_dir }}"
    services: [alertmanager]
    state: restarted

---
ollama_image: ollama/ollama
ollama_version: "0.40.12"

ollama_dir: /opt/ollama
ollama_data_dir: /srv/llm/ollama
ollama_cuda_cache_dir: /srv/llm/ollama-cuda-cache
# Слушает только localhost, наружу — через llm_proxy
ollama_port: 11434

ollama_model: qwen3:8b

ollama_keep_alive: "-1" # не выгружать модель из памяти
ollama_num_parallel: 4
ollama_max_loaded_models: 1
ollama_flash_attention: true
ollama_kv_cache_type: q8_0
ollama_context_length: 8192

# Другие LLM-бэкенды на этом хосте: их останавливаем, чтобы не делить видеопамять
ollama_conflicting_projects:
  - /opt/vllm

ollama_start_retries: 30
ollama_pull_timeout: 3600
ollama_warmup_timeout: 600

---
# Driver branch from the Ubuntu archive (nvidia-*-<branch>-server[-open]).
# 580 is a long-lived branch, supports CUDA 12.x/13.x. 595 is also available.
nvidia_driver_branch: "580"
# Open kernel modules: recommended for Turing+, required for Blackwell
nvidia_driver_open: true

# Kernel flavour for signed modules linux-modules-nvidia-*-<flavour>.
# auto: generic-hwe-<version> for an HWE kernel, otherwise the running kernel suffix (generic)
nvidia_driver_kernel_flavour: auto

# Keep driver and kernel on hold: upgrade only deliberately with
# -e nvidia_driver_upgrade=true (unholds, upgrades, reboots)
nvidia_driver_hold: true
nvidia_driver_upgrade: false

nvidia_driver_reboot: true
nvidia_driver_reboot_timeout: 900
nvidia_driver_persistenced: true
# Only for HGX/NVSwitch systems (8x H100/H200/B200)
nvidia_driver_fabricmanager: false

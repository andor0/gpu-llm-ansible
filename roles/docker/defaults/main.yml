---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Conflicting packages from the Ubuntu archive
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - podman-docker
  - containerd
  - runc

docker_log_max_size: 50m
docker_log_max_file: 5
# Extra daemon.json settings
docker_daemon_extra_config: {}

# Users in the docker group (effectively root access)
docker_users: []

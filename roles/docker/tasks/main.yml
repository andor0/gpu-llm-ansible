---
- name: Remove conflicting packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

# The same repo as a .list file with a different signed-by breaks apt update
- name: Remove legacy Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_apt_arch[ansible_facts['architecture']] }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  vars:
    docker_apt_arch:
      x86_64: amd64
      aarch64: arm64
  register: docker_repo

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | combine(docker_daemon_extra_config, recursive=true) | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    docker_daemon_config:
      log-driver: json-file
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file | string }}"
      features:
        cdi: true
      # Same as `nvidia-ctk runtime configure` writes; daemon.json is fully managed here
      runtimes: >-
        {{ {'nvidia': {'path': 'nvidia-container-runtime', 'args': []}}
           if gpu_enabled else {} }}
  notify: Restart docker

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Apply Docker config
  ansible.builtin.meta: flush_handlers

- name: Set up container autoheal
  when: docker_autoheal_enabled
  block:
    - name: Install autoheal script
      ansible.builtin.copy:
        src: container-autoheal.sh
        dest: /usr/local/bin/container-autoheal
        owner: root
        group: root
        mode: "0755"

    - name: Install autoheal systemd units
      ansible.builtin.template:
        src: "container-autoheal.{{ item }}.j2"
        dest: "/etc/systemd/system/container-autoheal.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      register: docker_autoheal_units

    # daemon-reload only when units change: it can make running GPU containers lose
    # their devices (see README, known limitations)
    - name: Enable autoheal timer
      ansible.builtin.systemd_service:
        name: container-autoheal.timer
        enabled: true
        state: started
        daemon_reload: "{{ docker_autoheal_units is changed }}"

---
- name: Remove conflicting packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

# Тот же репозиторий в формате .list с другим signed-by ломает apt update
- name: Remove legacy Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_apt_arch[ansible_facts['architecture']] }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  vars:
    docker_apt_arch:
      x86_64: amd64
      aarch64: arm64
  register: docker_repo

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | combine(docker_daemon_extra_config, recursive=true) | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    docker_daemon_config:
      log-driver: json-file
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file | string }}"
      features:
        cdi: true
      # То же, что пишет `nvidia-ctk runtime configure`; daemon.json целиком управляется здесь
      runtimes: >-
        {{ {'nvidia': {'path': 'nvidia-container-runtime', 'args': []}}
           if gpu_enabled | default(false) else {} }}
  notify: Restart docker

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Apply Docker config
  ansible.builtin.meta: flush_handlers

---
monitoring_agent_dir: /opt/monitoring-agent

monitoring_agent_node_exporter_image: prom/node-exporter:v1.12.1
monitoring_agent_dcgm_exporter_image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless
monitoring_agent_vmagent_image: victoriametrics/vmagent:v1.155.0

# All ports listen on localhost only: metrics leave the host via vmagent remote write
monitoring_agent_node_exporter_port: 9100
monitoring_agent_dcgm_exporter_port: 9400
monitoring_agent_vmagent_port: 8429

monitoring_agent_remote_write_url: "{{ monitoring_remote_write_url }}"
monitoring_agent_remote_write_username: "{{ monitoring_write_username | default('vmwriter') }}"
monitoring_agent_remote_write_password: "{{ monitoring_write_password | default('') }}"
monitoring_agent_scrape_interval: 15s

# VictoriaMetrics uses a self-signed certificate: vmagent trusts exactly that certificate,
# read from the first host of the `monitoring` group. Empty: use the system CA store
# (for a publicly trusted certificate).
monitoring_agent_ca_source: /opt/monitoring/tls/vm.crt

# node_exporter textfile collector (container health from the docker role's autoheal timer)
monitoring_agent_textfile_dir: "{{ docker_textfile_dir | default('/var/lib/node_exporter/textfile') }}"

# Wait until this host's metrics show up in VictoriaMetrics
monitoring_agent_verify: true

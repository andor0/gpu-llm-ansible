---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: collections-${{ hashFiles('requirements.yml') }}

      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          tests/ci/install-collections.sh

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: |
          for pb in playbooks/*.yml; do
            ansible-playbook -i inventories/example/hosts.yml --syntax-check "$pb"
          done

  e2e-ollama-cpu:
    name: E2E (monitoring + Ollama on CPU)
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Container images and the model need several GB; the runner image ships with toolchains we do not use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: collections-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible
        run: |
          pip install -r requirements-dev.txt
          tests/ci/install-collections.sh

      - name: Run monitoring playbook
        run: ansible-playbook -i tests/ci/inventory.yml playbooks/monitoring.yml

      - name: Run Ollama playbook
        run: ansible-playbook -i tests/ci/inventory.yml playbooks/ollama.yml

      - name: Idempotence (second run must not change anything)
        env:
          ANSIBLE_FORCE_COLOR: "0"
        run: |
          for pb in monitoring ollama; do
            ansible-playbook -i tests/ci/inventory.yml "playbooks/$pb.yml" --diff | tee "$RUNNER_TEMP/$pb-second-run.log"
            grep -qE 'changed=0 +unreachable=0 +failed=0' "$RUNNER_TEMP/$pb-second-run.log"
          done

      # Same checks as the llm_verify role, but with curl, as in the README example
      - name: Smoke test API through nginx
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/v1/models)
          test "$code" = 401

          curl -sfk https://localhost/v1/chat/completions \
            -H "Authorization: Bearer ci-test-token-0123456789" \
            -H "Content-Type: application/json" \
            -d '{"model": "qwen2.5:0.5b", "messages": [{"role": "user", "content": "Say pong"}], "max_tokens": 10}' \
            | tee "$RUNNER_TEMP/response.json"
          jq -e '.choices[0].message.content | length > 0' "$RUNNER_TEMP/response.json"

      # Tagged runs must work: common's GPU detection is tagged `always`
      - name: Run only llm_verify via tags
        run: ansible-playbook -i tests/ci/inventory.yml playbooks/ollama.yml --tags llm_verify

      - name: Check metrics in VictoriaMetrics (HTTPS, verified certificate) and Grafana
        run: |
          vm() {
            curl -sf --cacert /opt/monitoring/tls/vm.crt -u vmwriter:ci-test-vm-password \
              --data-urlencode "query=$1" https://127.0.0.1:8428/api/v1/query
          }
          vm 'up{job="node"}' | jq -e '.data.result | length > 0'
          vm 'container_healthy{name="ollama"}' | jq -e '.data.result[0].value[1] == "1"'
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert /opt/monitoring/tls/vm.crt https://127.0.0.1:8428/api/v1/query?query=up)
          test "$code" = 401
          curl -sf -u admin:ci-test-grafana http://127.0.0.1:3000/api/datasources/uid/victoriametrics/health \
            | jq -e '.status == "OK"'
          curl -sf -u admin:ci-test-grafana 'http://127.0.0.1:3000/api/search?type=dash-db' | jq -e 'length == 3'

      # A container whose healthcheck always fails must be restarted by the autoheal timer
      - name: Check container autoheal
        run: |
          docker run -d --name autoheal-test --label autoheal=true \
            --health-cmd false --health-interval 2s --health-retries 1 \
            alpine:3 sleep 600
          for i in $(seq 30); do
            restarts=$(sudo cat /var/lib/container-autoheal/autoheal-test.restarts 2>/dev/null || echo 0)
            [ "$restarts" -ge 1 ] && break
            sleep 5
          done
          echo "restarts: $restarts"
          test "$restarts" -ge 1
          journalctl -t container-autoheal --no-pager | tail -5
          grep autoheal-test /var/lib/node_exporter/textfile/container_health.prom
          docker rm -f autoheal-test

      - name: Container logs
        if: failure()
        run: |
          docker ps -a
          systemctl status container-autoheal.timer --no-pager || true
          for c in ollama vmagent victoriametrics vmalert grafana; do
            echo "::group::$c"; docker logs "$c" --tail 100 || true; echo "::endgroup::"
          done
          sudo nginx -T || true
          sudo tail -n 50 /var/log/nginx/error.log || true
